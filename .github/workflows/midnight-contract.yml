name: Midnight Contract

on:
  push:
    branches: [main]
    paths:
      - 'contracts/midnight/**'
      - '.github/workflows/midnight-contract.yml'
  pull_request:
    paths:
      - 'contracts/midnight/**'
      - '.github/workflows/midnight-contract.yml'
  workflow_dispatch:

jobs:
  compact-zk-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Compact devtools + mainnet-compatible toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1
          compact compile --version

      - name: Compile PrivateRisk Compact contract and ZK artifacts
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact compile \
            contracts/midnight/privaterisk.compact \
            contracts/midnight/managed/privaterisk

      - name: Prove generated artifact boundary
        shell: bash
        run: |
          test -d contracts/midnight/managed/privaterisk/contract
          test -d contracts/midnight/managed/privaterisk/keys
          test -d contracts/midnight/managed/privaterisk/zkir
          echo 'Compact contract, proving/verifying keys and ZKIR generated.'

      - name: Install Midnight simulator dependencies
        working-directory: contracts/midnight
        run: npm install

      - name: Execute private predicate simulator tests
        working-directory: contracts/midnight
        run: npm test

      - name: Upload compiled Midnight contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privaterisk-midnight-compact-artifacts
          path: contracts/midnight/managed/privaterisk
          retention-days: 7
