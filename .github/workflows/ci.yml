name: CI

on:
  push:
    branches: [main, build/v0.3-live-proving]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Compact toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1
          compact compile --version

      - name: Compile Midnight contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run midnight:compile

      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run midnight:stage
      - run: npm run build

      - name: Assert browser proving assets
        run: |
          test -f dist/zk/keys/proveBalanceForTransfer.prover
          test -f dist/zk/keys/proveBalanceForTransfer.verifier
          test -f dist/zk/zkir/proveBalanceForTransfer.bzkir
          test -f dist/zk/manifest.json
          find dist/zk/params -name 'bls_midnight_2p*' -print -quit | grep -q .
